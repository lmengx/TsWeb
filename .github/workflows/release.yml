name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签，例如 v1.0.1'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      # 1) 构建前端 → 产出 frontend/dist
      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # 2) 复制前端产物进 backend/dist
      - name: Copy dist to backend
        shell: pwsh
        run: |
          if (Test-Path backend/dist) { Remove-Item backend/dist -Recurse -Force }
          Copy-Item frontend/dist backend/dist -Recurse

      # 3) backend 安装依赖 → 产出 node_modules
      - name: Install backend deps
        working-directory: backend
        run: pnpm install --frozen-lockfile

      # 4) 打包前自检：缺任何一项就失败，不再发布残缺包
      - name: Verify artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path backend/dist/index.html)) { throw '缺少 backend/dist —— 前端构建未生效' }
          if (-not (Test-Path backend/node_modules/express)) { throw '缺少 backend/node_modules —— 依赖安装未生效' }

      # 5) 打包整个 backend 文件夹
      - name: Package backend
        shell: pwsh
        run: Compress-Archive -Path backend -DestinationPath tsweb-backend.zip -Force

      # 6) 发布 Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: tsweb-backend.zip
